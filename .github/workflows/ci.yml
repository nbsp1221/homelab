name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-lint:
    name: Compose lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Install Ansible tooling
        run: pip install -r ansible/requirements.txt

      - name: Validate inventory
        working-directory: ansible
        run: ansible-inventory --graph

      - name: Validate playbook syntax
        working-directory: ansible
        run: |
          ansible-playbook playbooks/audit.yml --syntax-check
          ansible-playbook playbooks/site.yml --syntax-check
          ansible-playbook playbooks/maintenance.yml --syntax-check

      - name: Lint Ansible project
        working-directory: ansible
        run: ansible-lint .
