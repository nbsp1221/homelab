name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-lint:
    name: Compose lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: ansible/uv.lock

      - name: Set up Python
        working-directory: ansible
        run: uv python install

      - name: Synchronize Ansible tooling
        working-directory: ansible
        run: uv sync --locked

      - name: Validate inventory
        working-directory: ansible
        run: uv run ansible-inventory --graph

      - name: Validate playbook syntax
        working-directory: ansible
        run: |
          uv run ansible-playbook playbooks/bootstrap.yml --syntax-check
          uv run ansible-playbook playbooks/audit.yml --syntax-check
          uv run ansible-playbook playbooks/site.yml --syntax-check
          uv run ansible-playbook playbooks/maintenance.yml --syntax-check

      - name: Lint Ansible project
        working-directory: ansible
        run: uv run ansible-lint .
