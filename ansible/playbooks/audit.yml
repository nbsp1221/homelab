---
- name: Audit managed hosts
  hosts: managed_hosts
  gather_facts: true

  tasks:
    - name: Read the Docker CE package version
      ansible.builtin.command:
        argv:
          - dpkg-query
          - --show
          - --showformat=${Status}|${Version}
          - docker-ce
      register: audit_docker_ce_package
      check_mode: false
      changed_when: false
      failed_when: audit_docker_ce_package.rc not in [0, 1]

    - name: Read active swap devices
      ansible.builtin.command:
        argv:
          - /sbin/swapon
          - --show
          - --bytes
          - --noheadings
      register: audit_active_swap
      check_mode: false
      changed_when: false

    - name: Read swap entries from fstab
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - ^[^#].*[[:space:]]swap[[:space:]]
          - /etc/fstab
      register: audit_fstab_swap
      check_mode: false
      changed_when: false
      failed_when: audit_fstab_swap.rc not in [0, 1]

    - name: Inspect the Docker repository definition
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/docker.sources
      register: audit_docker_repository

    - name: Read the Docker Engine version
      ansible.builtin.command:
        argv:
          - docker
          - version
          - --format
          - "{{ '{{' }}.Server.Version{{ '}}' }}"
      register: audit_docker_version
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Read the Docker Compose version
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - version
          - --short
      register: audit_compose_version
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: audit_reboot_required

    - name: Report host baseline
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          os: "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
          kernel: "{{ ansible_facts.kernel }}"
          architecture: "{{ ansible_facts.architecture }}"
          python: "{{ ansible_facts.python.version.major }}.{{ ansible_facts.python.version.minor }}.{{ ansible_facts.python.version.micro }}"
          memory_mb: "{{ ansible_facts.memtotal_mb }}"
          active_swap: "{{ audit_active_swap.stdout_lines }}"
          fstab_swap: "{{ audit_fstab_swap.stdout_lines }}"
          docker_repository: "{{ audit_docker_repository.stat.exists }}"
          docker_version: "{{ audit_docker_version.stdout | default('unavailable', true) }}"
          compose_version: "{{ audit_compose_version.stdout | default('unavailable', true) }}"
          docker_service: "{{ ansible_facts.services.get('docker.service', {}).get('state', 'unavailable') }}"
          docker_ce_package: >-
            {{ [audit_docker_ce_package.stdout.split('|', 1)[1]]
               if audit_docker_ce_package.stdout
                  is match('^install ok installed[|]') else [] }}
          reboot_required: "{{ audit_reboot_required.stat.exists }}"
