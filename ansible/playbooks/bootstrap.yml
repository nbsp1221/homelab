---
- name: Bootstrap managed hosts for Ansible
  hosts: managed_hosts
  become: true
  gather_facts: false
  serial: 1

  tasks:
    - name: Install Debian target prerequisites
      ansible.builtin.raw: |
        set -eu
        missing=""
        for package in python3-apt python3-debian; do
          if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null \
            | grep -q '^install ok installed$'; then
            missing="$missing $package"
          fi
        done
        if [ -n "$missing" ]; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends $missing
          printf 'changed\n'
        fi
      register: bootstrap_packages
      changed_when: "'changed' in bootstrap_packages.stdout_lines"
