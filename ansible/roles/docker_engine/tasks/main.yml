---
- name: Require a supported Docker Engine distribution
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in docker_engine_supported_distributions
    fail_msg: >-
      Docker Engine automation currently supports Debian and Ubuntu only;
      detected {{ ansible_facts.distribution }}.

- name: Gather installed package facts for Docker Engine
  ansible.builtin.package_facts:
    manager: auto

- name: Find conflicting Docker packages
  ansible.builtin.set_fact:
    docker_engine_installed_conflicts: >-
      {{ docker_engine_conflicting_packages
         | intersect(ansible_facts.packages.keys() | list)
         | sort }}

- name: Refuse an implicit Docker package migration
  ansible.builtin.assert:
    that:
      - docker_engine_installed_conflicts | length == 0
    fail_msg: >-
      Conflicting Docker packages are installed:
      {{ docker_engine_installed_conflicts | join(', ') }}. Migrate them
      explicitly before allowing this role to manage Docker CE.

- name: Map the host architecture for Docker's repository
  ansible.builtin.set_fact:
    docker_engine_apt_architecture: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}
         .get(ansible_facts.architecture, ansible_facts.architecture) }}

- name: Configure Docker's official APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - >-
        https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
    suites:
      - "{{ ansible_facts.distribution_release }}"
    components:
      - stable
    architectures:
      - "{{ docker_engine_apt_architecture }}"
    signed_by: >-
      https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg
    state: present
  register: docker_engine_repository

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name: "{{ docker_engine_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start Docker Engine
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Grant configured operators access to Docker Engine
  ansible.builtin.user:
    name: "{{ item }}"
    groups:
      - docker
    append: true
  loop: "{{ docker_engine_users }}"

- name: Verify Docker Engine
  ansible.builtin.include_tasks: verify.yml
  when: not ansible_check_mode
