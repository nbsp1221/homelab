---
- name: Read the Docker Engine server version
  ansible.builtin.command:
    argv:
      - docker
      - version
      - --format
      - "{{ '{{' }}.Server.Version{{ '}}' }}"
  register: docker_engine_server_version
  changed_when: false

- name: Read the Docker Compose version
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
      - --short
  register: docker_engine_compose_version
  changed_when: false

- name: Read the Docker Engine service state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - docker
  register: docker_engine_service_state
  changed_when: false

- name: Assert the Docker Engine state
  ansible.builtin.assert:
    that:
      - docker_engine_server_version.stdout | length > 0
      - docker_engine_compose_version.stdout | length > 0
      - docker_engine_service_state.stdout == "active"
    fail_msg: Docker Engine or the Compose plugin failed post-install verification.
