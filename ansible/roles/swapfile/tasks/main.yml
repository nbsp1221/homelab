---
- name: Validate swap file configuration
  ansible.builtin.assert:
    that:
      - swapfile_path is match('^/')
      - swapfile_size_mb | int > 0
    fail_msg: Swap file path must be absolute and size must be positive.
  when: swapfile_enabled | bool

- name: Inspect the configured swap file
  ansible.builtin.stat:
    path: "{{ swapfile_path }}"
  register: swapfile_initial_stat
  when: swapfile_enabled | bool

- name: Validate an existing swap file
  ansible.builtin.assert:
    that:
      - swapfile_initial_stat.stat.isreg
      - swapfile_initial_stat.stat.size == (swapfile_size_mb | int * 1024 * 1024)
    fail_msg: >-
      {{ swapfile_path }} already exists but is not a regular
      {{ swapfile_size_mb }} MiB file. Refusing to resize or replace active
      swap automatically.
  when:
    - swapfile_enabled | bool
    - swapfile_initial_stat.stat.exists

- name: Read matching swap entries from fstab
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - "^{{ swapfile_path | regex_escape }}[[:space:]]"
      - /etc/fstab
  register: swapfile_initial_fstab
  check_mode: false
  changed_when: false
  failed_when: swapfile_initial_fstab.rc not in [0, 1]
  when: swapfile_enabled | bool

- name: Reject duplicate swap entries
  ansible.builtin.assert:
    that:
      - swapfile_initial_fstab.stdout_lines | length <= 1
    fail_msg: >-
      Multiple fstab entries exist for {{ swapfile_path }}. Resolve them
      manually before running this role.
  when: swapfile_enabled | bool

- name: Allocate the swap file
  ansible.builtin.command:
    argv:
      - fallocate
      - -l
      - "{{ swapfile_size_mb }}MiB"
      - "{{ swapfile_path }}"
    creates: "{{ swapfile_path }}"
  register: swapfile_allocation
  when: swapfile_enabled | bool

- name: Secure the swap file
  ansible.builtin.file:
    path: "{{ swapfile_path }}"
    owner: root
    group: root
    mode: "0600"
    state: file
  when:
    - swapfile_enabled | bool
    - swapfile_initial_stat.stat.exists or not ansible_check_mode

- name: Format a newly allocated swap file
  ansible.builtin.command:
    argv:
      - /sbin/mkswap
      - "{{ swapfile_path }}"
  changed_when: true
  when:
    - swapfile_enabled | bool
    - swapfile_allocation is changed
    - not ansible_check_mode

- name: Persist the swap file
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ swapfile_path | regex_escape }}[[:space:]]"
    line: "{{ swapfile_path }} none swap sw 0 0"
    state: present
    backup: true
  when: swapfile_enabled | bool

- name: Read active swap devices
  ansible.builtin.command:
    argv:
      - /sbin/swapon
      - --show
      - --noheadings
      - --raw
      - --output
      - NAME
  register: swapfile_active_devices
  check_mode: false
  changed_when: false
  when: swapfile_enabled | bool

- name: Activate the swap file
  ansible.builtin.command:
    argv:
      - /sbin/swapon
      - "{{ swapfile_path }}"
  changed_when: true
  when:
    - swapfile_enabled | bool
    - swapfile_path not in swapfile_active_devices.stdout_lines
    - not ansible_check_mode

- name: Verify the swap file
  ansible.builtin.include_tasks: verify.yml
  when:
    - swapfile_enabled | bool
    - not ansible_check_mode
