---
- name: Inspect the converged swap file
  ansible.builtin.stat:
    path: "{{ swapfile_path }}"
  register: swapfile_final_stat

- name: Read the converged active swap devices
  ansible.builtin.command:
    argv:
      - /sbin/swapon
      - --show=NAME
      - --noheadings
      - --raw
  register: swapfile_final_active_devices
  changed_when: false

- name: Read the converged swap entries from fstab
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - "^[[:space:]]*{{ swapfile_path | regex_escape }}[[:space:]]"
      - /etc/fstab
  register: swapfile_final_fstab
  changed_when: false

- name: Assert the swap file state
  ansible.builtin.assert:
    that:
      - swapfile_final_stat.stat.exists
      - swapfile_final_stat.stat.isreg
      - swapfile_final_stat.stat.size == (swapfile_size_mb | int * 1024 * 1024)
      - swapfile_final_stat.stat.pw_name == "root"
      - swapfile_final_stat.stat.gr_name == "root"
      - swapfile_final_stat.stat.mode == "0600"
      - swapfile_path in swapfile_final_active_devices.stdout_lines
      - swapfile_final_fstab.stdout_lines == [swapfile_path ~ ' none swap sw 0 0']
    fail_msg: The swap file did not converge to the requested state.
