---
- name: Require a Debian-family operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
    fail_msg: >-
      The baseline currently supports Debian-family systems only; detected
      {{ ansible_facts.distribution }}.

- name: Install baseline prerequisite packages
  ansible.builtin.apt:
    name: "{{ system_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
