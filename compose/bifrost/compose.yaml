name: bifrost

services:
  bifrost:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
      args:
        BIFROST_VERSION: "1.6.11"
    container_name: bifrost
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      APP_DIR: /app/data
      LOG_LEVEL: info
      LOG_STYLE: json
      GOGC: "200"
      GOMEMLIMIT: 900MiB
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY}
    expose:
      - "8080"
    networks:
      - caddy-network
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true

networks:
  caddy-network:
    name: caddy-network
    external: true
