name: opencodex

services:
  opencodex:
    build:
      context: .
      args:
        OPENCODEX_VERSION: ${OPENCODEX_VERSION:?}
    container_name: opencodex
    init: true
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "10100"
    networks:
      - caddy-network
    volumes:
      - opencodex-data:/home/node/.opencodex
      - ${CODEX_HOST_HOME:?}:/run/codex-host:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10100/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  caddy-network:
    name: caddy-network
    external: true

volumes:
  opencodex-data:
