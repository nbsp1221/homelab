provider: gcp
docker:
  wait_for_tailscale: true
  tailscale_bind_addresses:
    - &tailscale_ipv4 100.82.114.104
    - &tailscale_ipv6 fd7a:115c:a1e0::7536:7269
stacks:
  beszel-agent:
    env:
      BESZEL_HUB_URL: https://beszel.retn0.dev
  caddy-gcp:
    env:
      CADDY_DOMAIN: beszel.retn0.dev
      CADDY_BIND_IPV4: *tailscale_ipv4
      CADDY_BIND_IPV6: *tailscale_ipv6
  beszel-hub:
    env:
      BESZEL_APP_URL: https://beszel.retn0.dev
