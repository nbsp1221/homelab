[project]
name = "homelab-pyinfra"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyinfra==3.10.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = false
