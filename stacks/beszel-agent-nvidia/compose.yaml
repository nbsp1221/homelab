name: beszel-agent-nvidia

services:
  beszel-agent:
    image: henrygd/beszel-agent-nvidia:0.21.0
    container_name: beszel-agent
    depends_on:
      beszel-socket-proxy:
        condition: service_started
    init: true
    restart: unless-stopped
    environment:
      KEY: ${BESZEL_AGENT_KEY:?}
      TOKEN_FILE: /run/secrets/beszel_agent_token
      HUB_URL: ${BESZEL_HUB_URL:?}
      DISABLE_SSH: "true"
      FILESYSTEM: ${BESZEL_FILESYSTEM:?Set BESZEL_FILESYSTEM}
      GPU_COLLECTOR: nvidia-smi
      SENSORS: ${BESZEL_SENSORS:-}
      SMART_DEVICES: ${BESZEL_SMART_DEVICES:?Set BESZEL_SMART_DEVICES}
      DOCKER_HOST: tcp://127.0.0.1:2375
      SERVICE_PATTERNS: ${BESZEL_SERVICE_PATTERNS:-}
    secrets:
      - beszel_agent_token
    network_mode: host # composelint-disable-line no-host-network -- host interface metrics require it; SSH is disabled
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - type: bind
        source: ${BESZEL_EXTRA_FILESYSTEM_PATH:?Set BESZEL_EXTRA_FILESYSTEM_PATH}
        target: /extra-filesystems/sda1
        read_only: true
        bind:
          create_host_path: false
    devices:
      - ${BESZEL_NVME_DEVICE:?Set BESZEL_NVME_DEVICE}:${BESZEL_NVME_DEVICE:?Set BESZEL_NVME_DEVICE}
      - ${BESZEL_SECONDARY_DEVICE:?Set BESZEL_SECONDARY_DEVICE}:${BESZEL_SECONDARY_DEVICE:?Set BESZEL_SECONDARY_DEVICE}
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - utility
    cap_add:
      - SYS_ADMIN
      - SYS_RAWIO

  # composelint-disable-next-line require-healthcheck -- verify the proxy through Docker metrics in the Hub.
  beszel-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.2
    container_name: beszel-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
    ports:
      # Published on host loopback for access from the host-network agent.
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
    read_only: true

volumes:
  beszel-agent-data:

secrets:
  beszel_agent_token:
    file: ${BESZEL_AGENT_TOKEN_PATH:?Set BESZEL_AGENT_TOKEN_PATH}
